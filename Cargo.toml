[package]
name = "good-parts"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arborist-metrics = "0.1.3"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "good-parts"
path = "src/main.rs"

[[bin]]
name = "cargo-good-parts"
path = "src/bin/cargo-good-parts.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
